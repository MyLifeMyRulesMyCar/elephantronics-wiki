name: Deploy to GitHub Pages

on:
  # Deploy whenever main is updated.
  push:
    branches: [main]
  # Allow a manual deploy from the Actions tab.
  workflow_dispatch:

# Minimum permissions: read the repository, publish to Pages, and mint the
# deployment identity token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          # Starlight reads commit dates for each page's "Last updated" line.
          # A shallow clone would date every page to the deployment commit.
          fetch-depth: 0

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # The action detects npm from package-lock.json, installs dependencies,
        # runs `npm run build`, and uploads the static output.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
